<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Midterm Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b5bd6'/%3E%3Cpath d='M9 11c0-2 3-3 7-3s7 1 7 3-3 3-7 3-7-1-7-3zm0 0v5c0 2 3 3 7 3s7-1 7-3v-5M9 16v5c0 2 3 3 7 3s7-1 7-3v-5' fill='none' stroke='white' stroke-width='1.8'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f5f6fa; --surface:#ffffff; --surface2:#f0f2f8; --ink:#1b2236; --ink2:#566079; --line:#e1e5ef;
  --accent:#5b5bd6; --accent-ink:#ffffff; --accent-soft:#e9e9fb;
  --ok:#15803d; --ok-soft:#e2f5e9; --warn:#b45309; --warn-soft:#fdf0d9; --bad:#c62828; --bad-soft:#fde8e8;
  --code-bg:#14192b; --code-ink:#e6e9f5; --code-line:#262d47;
  --k:#8fa2ff; --s:#a5e3a1; --n:#ffc27a; --c:#7b86a8; --f:#7fd7ff; --b:#ff9fc3;
  --shadow:0 1px 2px rgba(20,25,50,.06),0 6px 24px rgba(20,25,50,.06);
  --r:14px; --mono:"JetBrains Mono","Cascadia Code","Fira Code",Consolas,"SFMono-Regular",monospace;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#161c30; --surface2:#1d2540; --ink:#e8ebf7; --ink2:#9aa5c4; --line:#2a3354;
  --accent:#8f8fff; --accent-ink:#0e1220; --accent-soft:#25285a;
  --ok:#5fd68a; --ok-soft:#14352a; --warn:#f0b35a; --warn-soft:#3a2d12; --bad:#ff7b7b; --bad-soft:#3d1c24;
  --code-bg:#0a0e1b; --code-line:#222b4a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1220; --surface:#161c30; --surface2:#1d2540; --ink:#e8ebf7; --ink2:#9aa5c4; --line:#2a3354;
    --accent:#8f8fff; --accent-ink:#0e1220; --accent-soft:#25285a;
    --ok:#5fd68a; --ok-soft:#14352a; --warn:#f0b35a; --warn-soft:#3a2d12; --bad:#ff7b7b; --bad-soft:#3d1c24;
    --code-bg:#0a0e1b; --code-line:#222b4a; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
code{font-family:var(--mono);font-size:.88em;background:var(--surface2);border:1px solid var(--line);padding:.05em .38em;border-radius:6px}
.app{display:grid;grid-template-columns:272px 1fr;min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 14px 28px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:1.05rem;letter-spacing:-.01em;cursor:pointer}
.brand i{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-style:normal;font-size:.95rem}
.nav-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink2);padding:14px 10px 6px;font-weight:600}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:.93rem;line-height:1.25}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .wn{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-size:.78rem;font-weight:700;color:var(--ink2)}
.nav a.on .wn{background:var(--accent);color:var(--accent-ink)}
.nav .dot{margin-left:auto;font-size:.72rem;color:var(--ink2);white-space:nowrap}
.nav .dot.done{color:var(--ok);font-weight:700}
.side-foot{margin-top:auto;padding:14px 10px 0;display:flex;gap:8px}
.main{min-width:0}
.top{display:none}
.wrap{max-width:980px;margin:0 auto;padding:30px 28px 90px}
/* generic */
.btn{text-decoration:none;display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:.88rem;transition:.12s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08);color:var(--accent-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;font-size:.8rem;border-radius:8px}
.btn[disabled]{opacity:.5;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--ink2)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
h1{font-size:2rem;line-height:1.2;letter-spacing:-.02em;margin:0 0 6px}
h2{font-size:1.35rem;letter-spacing:-.01em;margin:34px 0 10px}
h3{font-size:1.05rem;margin:22px 0 8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:.76rem;font-weight:600;color:var(--ink2)}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
/* hero + home */
.hero{padding:30px;border-radius:20px;background:linear-gradient(135deg,var(--accent) 0%,#7a5bd6 60%,#c05bd6 130%);color:#fff;box-shadow:var(--shadow)}
.hero h1{color:#fff;font-size:2.2rem}
.hero p{margin:8px 0 18px;max-width:60ch;opacity:.95}
.hero .btn{background:#fff;color:#3c3cb5;border-color:#fff}
.hero .btn.line{background:transparent;color:#fff;border-color:rgba(255,255,255,.6)}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 6px}
.steps3 div{padding:14px 16px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.steps3 b{display:block;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-top:14px}
.wcard{padding:16px 18px;cursor:pointer;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;transition:.15s;position:relative}
.wcard:hover{transform:translateY(-2px);border-color:var(--accent)}
.wcard .num{font-size:.74rem;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.wcard h3{margin:0;font-size:1.1rem}
.wcard p{margin:0;font-size:.88rem;color:var(--ink2)}
.bar{height:6px;border-radius:9px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:9px;transition:width .3s}
/* week header + tabs */
.whead .num{color:var(--accent);font-weight:700;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 22px;position:sticky;top:0;background:var(--bg);z-index:5;padding-top:6px}
.tabs a{padding:10px 16px;border-radius:10px 10px 0 0;text-decoration:none;color:var(--ink2);font-weight:600;font-size:.93rem;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--ink)}
/* lesson */
.tldr{padding:16px 20px;border-radius:var(--r);background:var(--accent-soft);border:1px solid transparent}
.tldr b.t{display:block;color:var(--accent);font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.tldr ul{margin:0;padding-left:18px}
.lesson p{margin:8px 0}
.lesson ul,.lesson ol{padding-left:22px;margin:8px 0}
.lesson li{margin:3px 0}
.callout{display:flex;gap:12px;padding:12px 16px;border-radius:12px;margin:14px 0;border:1px solid transparent;font-size:.95rem}
.callout .ic{font-size:1.1rem;line-height:1.5}
.callout.tip{background:var(--ok-soft)}
.callout.trap{background:var(--bad-soft)}
.callout.exam{background:var(--warn-soft)}
.callout.note{background:var(--surface2);border-color:var(--line)}
.callout p{margin:0}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:12px;margin:12px 0;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface2);font-weight:600;font-size:.82rem;color:var(--ink2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td code{white-space:nowrap}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.cmp>div{padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.cmp b{display:block;margin-bottom:4px}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.flow span{padding:6px 12px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:.85rem}
.flow em{color:var(--ink2);font-style:normal}
/* code */
.codebox{margin:12px 0;border-radius:12px;overflow:hidden;background:var(--code-bg);border:1px solid var(--code-line)}
.codebox .cb-h{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--code-line);color:#8d98bd;font-size:.76rem;font-weight:600;letter-spacing:.04em}
.codebox .cb-h .sp{flex:1}
.codebox .cb-h button{background:#232c4c;color:#d6dcf5;border:0;border-radius:7px;padding:4px 10px;font-size:.76rem;cursor:pointer;font-weight:600}
.codebox .cb-h button:hover{background:var(--accent);color:var(--accent-ink)}
pre.code{margin:0;padding:14px 16px;overflow:auto;color:var(--code-ink);font:13.5px/1.6 var(--mono);tab-size:2;white-space:pre}
.k{color:var(--k);font-weight:600}.s{color:var(--s)}.n{color:var(--n)}.cm{color:var(--c);font-style:italic}.fn{color:var(--f)}.bd{color:var(--b)}
.cb-note{padding:8px 14px;border-top:1px solid var(--code-line);color:#aab3d6;font-size:.84rem;background:#10152a}
.cb-out{border-top:1px solid var(--code-line);padding:10px 14px;background:#0d1224;color:#d8def4}
/* results */
.res{margin-top:10px;font-size:.88rem}
.res .tw{overflow:auto;max-height:340px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.cb-out .res .tw{background:#141a31;border-color:var(--code-line);color:#d8def4}
.cb-out th{background:#1b2342;color:#9aa5c9}.cb-out td,.cb-out th{border-color:#262e50}
.res table{font-family:var(--mono);font-size:.82rem}
.res .msg{color:var(--ok);font-family:var(--mono);font-size:.84rem;margin:4px 0}
.res .cnt{color:var(--ink2);font-size:.8rem;margin:4px 2px 8px}
.res .err{color:var(--bad);font-family:var(--mono);font-size:.84rem;margin:4px 0;white-space:pre-wrap}
.cb-out .res .err{color:#ff8f8f}.cb-out .res .msg{color:#7ee0a0}
.res .stmt{font-family:var(--mono);font-size:.76rem;color:var(--ink2);margin:10px 0 3px}
.plout{font:13px/1.55 var(--mono);white-space:pre-wrap;padding:10px 12px;border-radius:10px;background:#0d1224;color:#d6f5dc;border:1px solid var(--code-line);margin:6px 0}
.null{color:var(--ink2);font-style:italic;opacity:.7}
/* practice */
.sheet{padding:22px 24px;margin-bottom:18px}
.sheet h2{margin:0 0 4px}
.guide{font-size:.86rem;background:var(--surface2);border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin-top:14px;color:var(--ink2)}
.guide b{color:var(--ink)}
details.ds{margin:14px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
details.ds>summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:.92rem}
details.ds .in{padding:0 14px 14px}
.tabrow{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.q{padding:18px 20px;margin:14px 0;position:relative;border-left:4px solid var(--line)}
.q.solved{border-left-color:var(--ok)}
.q .qh{display:flex;gap:12px;align-items:flex-start}
.q .qn{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.q.solved .qn{background:var(--ok);color:#fff}
.q .qt{font-weight:500;flex:1}
.q .qt p{margin:0}
.ed{width:100%;min-height:96px;margin:12px 0 8px;resize:vertical;padding:12px 14px;border-radius:12px;border:1px solid var(--code-line);background:var(--code-bg);color:var(--code-ink);font:13.5px/1.6 var(--mono);tab-size:2;outline:none}
.ed:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.92rem}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--surface2);color:var(--ink2)}
.fb b{display:block}
.chk{list-style:none;padding:0;margin:8px 0 0}
.chk li{padding:2px 0}
.chk li:before{content:"✓ ";color:var(--ok);font-weight:700}
.chk li.no:before{content:"✗ ";color:var(--bad)}
.hint{margin-top:10px;padding:10px 14px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.ans{margin-top:10px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mcq .opt{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;margin:8px 0;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;text-align:left;width:100%}
.mcq .opt:hover{border-color:var(--accent)}
.mcq .opt .l{flex:none;width:24px;height:24px;border-radius:7px;background:var(--surface2);display:grid;place-items:center;font-size:.76rem;font-weight:700;color:var(--ink2)}
.mcq .opt.right{background:var(--ok-soft);border-color:var(--ok)}.mcq .opt.right .l{background:var(--ok);color:#fff}
.mcq .opt.wrong{background:var(--bad-soft);border-color:var(--bad)}.mcq .opt.wrong .l{background:var(--bad);color:#fff}
.mcq .opt.dis{pointer-events:none}
.fillcode{margin:12px 0}
.fillcode pre.code{border-radius:12px;border:1px solid var(--code-line);background:var(--code-bg)}
.fillcode input{font:13px var(--mono);background:#232c4c;color:#fff;border:1px solid #3a4574;border-radius:6px;padding:1px 6px;width:9ch;text-align:center}
.fillcode input.good{border-color:#4ade80;background:#14452b}
.fillcode input.badi{border-color:#ff7b7b;background:#4a1d26}
.build{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:12px 0}
.build h4{margin:0 0 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink2)}
.build .col{min-height:120px;padding:10px;border-radius:12px;border:1px dashed var(--line);background:var(--surface2)}
.build button.ln{display:block;width:100%;text-align:left;margin:4px 0;padding:6px 10px;border-radius:8px;border:1px solid var(--code-line);background:var(--code-bg);color:var(--code-ink);font:12.5px/1.4 var(--mono);cursor:pointer;white-space:pre}
.build button.ln:hover{border-color:var(--accent)}
.build button.ln.bad{border-color:var(--bad);background:#3d1c24}
.build button.ln.good{border-color:#4ade80}
.score{display:flex;gap:16px;align-items:center;padding:16px 20px}
.score .big{font-size:2rem;font-weight:800;color:var(--accent)}
/* playground */
.play-ed{display:grid;grid-template-columns:1fr;gap:10px}
.schema{display:flex;gap:10px;flex-wrap:wrap}
.schema .tb{padding:6px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);font-size:.82rem;cursor:pointer}
.schema .tb b{font-family:var(--mono)}
.schema .tb:hover{border-color:var(--accent)}
select.sel{padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.inp{padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);width:100%}
.inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.kv{display:grid;grid-template-columns:140px 1fr;gap:8px;align-items:center;margin:8px 0}
.setch{display:inline-block;padding:2px 10px;border-radius:8px;background:var(--surface2);font-family:var(--mono);margin:2px}
.trace{font-family:var(--mono);font-size:.85rem}
.trace div{padding:3px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-weight:600;font-size:.9rem;box-shadow:var(--shadow);z-index:99;animation:pop .2s}
@keyframes pop{from{opacity:0;transform:translate(-50%,8px)}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s}
.menu-btn{display:none}
/* SQL*Plus terminal (always a black console, like the lab PC) */
.spx{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;background:#0c0c0c;color:#cccccc;font:16px/1.3 Consolas,"Lucida Console","Cascadia Mono","Courier New",monospace}
.spx-bar{flex:none;display:flex;align-items:center;height:32px;background:#1f1f1f;color:#fff;font:12px "Segoe UI",system-ui,sans-serif;user-select:none}
.spx-ic{display:grid;place-items:center;width:36px}
.spx-t{padding-right:14px;white-space:nowrap}
.spx-hint{flex:1;min-width:0;color:#8b8b8b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spx-hint.on{color:#7ee0a0}
.spx-b{flex:none;width:46px;height:32px;border:0;background:transparent;color:#fff;font-size:13px;cursor:pointer}
.spx-b:hover{background:#333}.spx-x:hover{background:#c42b1c}
.spx-scr{flex:1;overflow-y:scroll;overscroll-behavior:contain;padding:4px 6px 12px;cursor:text;scrollbar-color:#5a5a5a #171717}
.spx-scr pre{margin:0;font:inherit;white-space:pre-wrap;word-break:break-all;tab-size:8}
.spx ::selection{background:#cccccc;color:#0c0c0c}
.spx-cur{color:inherit}
.spx.focus .spx-cur{box-shadow:inset 0 -3px 0 #cccccc;animation:spxblink 1.06s step-end infinite}
@keyframes spxblink{50%{box-shadow:none}}
.spx-ta{position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:0;border:0;padding:0;resize:none;font-size:16px}
.spx-np{position:absolute;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:2}
.spx-npw{width:min(820px,94vw);height:min(70vh,640px);background:#fff;color:#000;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.6);font:12px "Segoe UI",system-ui,sans-serif}
.spx-npt{display:flex;align-items:center;height:30px;padding-left:12px;background:#f3f3f3}
.spx-npt .sp{flex:1}
.spx-npt button{width:46px;height:30px;border:0;background:transparent;cursor:pointer}.spx-npt button:hover{background:#c42b1c;color:#fff}
.spx-npm{display:flex;gap:16px;padding:4px 12px;border-bottom:1px solid #ddd}
.spx-npw textarea{flex:1;border:0;outline:0;resize:none;padding:6px 8px;font:15px/1.35 Consolas,"Courier New",monospace;color:#000;background:#fff}
.spx-npf{display:flex;gap:8px;align-items:center;padding:6px 10px;border-top:1px solid #ddd;background:#f3f3f3;color:#555}
.spx-npf span{flex:1}
.spx-npf button{padding:4px 12px;border:1px solid #bbb;background:#fff;border-radius:4px;cursor:pointer;color:#000}
.spx-npf button.pri{background:#0067c0;border-color:#0067c0;color:#fff}
/* mobile */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 25% 0 0;z-index:30;transform:translateX(-102%);transition:.2s;box-shadow:var(--shadow);height:100%}
  .side.open{transform:none}
  .top{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .menu-btn{display:inline-flex}
  .wrap{padding:20px 16px 80px}
